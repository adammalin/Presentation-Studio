name: Presentation Studio native PowerPoint qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-native-canary:
    runs-on:
      - self-hosted
      - macOS
      - presentation-studio-powerpoint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Run desktop and native synthetic qualification
        run: npm run quality:native
